# 将 api.example.com 替换成实际域名；证书路径以阿里云部署结果为准。
limit_req_zone $binary_remote_addr zone=xuantong_api:10m rate=5r/s;

server {
    listen 80;
    server_name api.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.example.com;

    ssl_certificate /etc/nginx/cert/api.example.com.pem;
    ssl_certificate_key /etc/nginx/cert/api.example.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 20m;

    location / {
        limit_req zone=xuantong_api burst=30 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 流式对话与工作流 SSE 不能被代理缓冲。
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
